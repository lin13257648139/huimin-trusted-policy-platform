name: reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Unit and API tests
        run: python -m pytest
      - name: Project integrity
        run: python scripts/check_project.py
      - name: Deterministic evaluations
        run: |
          python scripts/evaluate_conformance.py
          python scripts/evaluate_retrieval.py
          python scripts/evaluate_policy_compiler.py
          python scripts/evaluate_question_strategy.py
          python scripts/evaluate_ablation.py
      - name: Dependency consistency
        run: python -m pip check
