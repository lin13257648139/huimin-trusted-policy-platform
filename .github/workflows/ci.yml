name: reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pin the runner image so a GitHub-wide `ubuntu-latest` migration cannot
    # silently change the reproducibility environment during judging.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Install quality toolchain
        run: python -m pip install -r requirements-quality.txt
      - name: Ruff
        run: python -m ruff check app scripts tests
      - name: Type checking
        run: python -m mypy app
      - name: Unit, API and coverage gate
        run: |
          python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=json:data/evaluation/coverage_report.json
          python scripts/check_coverage.py
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser journeys, mobile keyboard and WCAG axe
        run: npm run test:e2e
      - name: Bandit
        run: python -m bandit -q -r app
      - name: Semgrep offline project rules
        run: semgrep scan --config .semgrep.yml --error --quiet app scripts
      - name: Independent AST security policy
        run: python scripts/static_security_policy.py app scripts
      - name: Secret scan
        run: |
          python -m detect_secrets scan --all-files --exclude-lines '"source_sha256"\s*:' \
            app scripts tests .env.example compose.yaml Dockerfile README.md > secret-scan.json
          python -c "import json,sys; p=json.load(open('secret-scan.json', encoding='utf-8')); n=sum(map(len,p['results'].values())); print('secret_candidates=',n); sys.exit(n != 0)"
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --cache-dir .pip-audit-cache --timeout 10 --progress-spinner off
      - name: Validated CycloneDX 1.6 SBOM
        run: python scripts/build_sbom.py
      - name: Project integrity
        run: python scripts/check_project.py
      - name: Deterministic evaluations
        run: |
          python scripts/evaluate_conformance.py
          python scripts/evaluate_retrieval.py
          python scripts/evaluate_policy_qa.py
          python scripts/evaluate_policy_compiler.py
          python scripts/build_question_strategy_benchmark.py
          python scripts/evaluate_question_strategy.py
          python scripts/evaluate_ablation.py
      - name: Dependency consistency
        run: python -m pip check
