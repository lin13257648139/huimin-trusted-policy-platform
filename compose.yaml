name: huimin-guide

services:
  huimin-guide:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?请先在.env中设置ADMIN_API_TOKEN}
      DATABASE_PATH: /app/storage/huimin.db
      AI_MODE: ${AI_MODE:-deterministic}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ALLOW_REMOTE_OLLAMA: ${ALLOW_REMOTE_OLLAMA:-false}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    volumes:
      - huimin-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp

volumes:
  huimin-storage:

